# mise.toml — Development environment for the linewatch project
# https://mise.jdx.dev
#
# Install mise, then from this directory:
#   mise trust
#   mise install
#   mise run check   # the same format and validation checks as CI
#   mise run fmt     # format all Terraform files

[settings]
# Create and update mise.lock, which records the exact Terraform version.
lockfile = true

[tools]
terraform = "1.16"
go = "1.27"

[shell_alias]
tf = "terraform"

[tasks.fmt]
description = "Format all Terraform files"
run = "terraform fmt -recursive"

[tasks.check]
description = "Run the same format and validation checks as CI"
run = [
  "terraform fmt -check -recursive -diff",
  # A separate data directory, like CI's fresh checkout: in a stack already
  # initialised against S3, init -backend=false still needs AWS credentials.
  """
  export TF_DATA_DIR=.terraform/check
  for d in live/account live/dev/ingest; do
    terraform -chdir="$d" init -backend=false -input=false
    terraform -chdir="$d" validate
  done
  """,
]

