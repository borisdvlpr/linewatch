name: Terraform Deploy

on:
  workflow_call:
    inputs:
      aws_region:
        description: AWS region to deploy to. Also selects the default backend config file.
        required: true
        type: string
      aws_account_id:
        description: AWS account ID to deploy to.
        required: true
        type: string
      working_directory:
        description: Directory of the Terraform root module, relative to the repository root.
        required: false
        type: string
        default: "."
      backend_config:
        description: Backend settings file, relative to working_directory. Defaults to env/<aws_region>.s3.tfbackend.
        required: false
        type: string
        default: ""
      role_name:
        description: IAM role to assume through GitHub OIDC.
        required: false
        type: string
        default: terraform-deployment-role
      environment:
        description: GitHub environment for the apply job, for example one with required reviewers. Empty means no approval gate.
        required: false
        type: string
        default: ""
      terraform_version:
        description: Terraform CLI version to install.
        required: false
        type: string
        default: "1.16.4"

permissions: {}

# One plan/apply cycle at a time per account, region and root module; a newer
# pending run replaces an older one. Callers must not reuse this group name.
concurrency:
  group: terraform-${{ inputs.aws_account_id }}-${{ inputs.aws_region }}-${{ inputs.working_directory }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Ignored by Terraform if the root module doesn't declare an aws_region variable.
  TF_VAR_aws_region: ${{ inputs.aws_region }}
  BACKEND_CONFIG: ${{ inputs.backend_config || format('env/{0}.s3.tfbackend', inputs.aws_region) }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the repository
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive -diff

      # No backend: validation needs neither AWS credentials nor state.
      - name: Terraform init
        run: terraform init -backend=false -lockfile=readonly

      - name: Terraform validate
        run: terraform validate

  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the repository
      id-token: write # to request an OIDC token for AWS
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
      artifact: ${{ steps.plan.outputs.artifact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/${{ inputs.role_name }}
          role-session-name: terraform-plan-${{ github.run_id }}
          role-duration-seconds: 1200
          allowed-account-ids: ${{ inputs.aws_account_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -backend-config="$BACKEND_CONFIG" -lockfile=readonly

      - name: Terraform plan
        id: plan
        env:
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          # Artifact names must be unique within a caller's run, and this workflow
          # can be called several times in one run (for example once per region).
          dir_slug=$(printf '%s' "$WORKING_DIRECTORY" | tr -c 'A-Za-z0-9-' '_')
          echo "artifact=tfplan-${AWS_ACCOUNT_ID}-${TF_VAR_aws_region}-${dir_slug}" >> "$GITHUB_OUTPUT"

          # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present
          exitcode=0
          terraform plan -detailed-exitcode -lock-timeout=5m -no-color -out=tfplan || exitcode=$?
          echo "exitcode=${exitcode}" >> "$GITHUB_OUTPUT"
          if [ "$exitcode" -eq 1 ]; then
            echo "::error::Terraform plan failed"
            exit 1
          fi

      - name: Write plan to job summary
        run: |
          terraform show -no-color tfplan > tfplan.txt
          {
            echo '## Terraform plan'
            echo
            echo '<details><summary>Show plan</summary>'
            echo
            echo '```terraform'
            head -c 900000 tfplan.txt # step summaries are limited to 1 MiB
            echo
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: ${{ inputs.working_directory }}/tfplan
          if-no-files-found: error
          overwrite: true
          # Saved plans can contain sensitive values in plain text.
          retention-days: 5

  apply:
    name: Apply
    needs: plan
    if: needs.plan.outputs.exitcode == '2'
    runs-on: ubuntu-latest
    # With required reviewers on this environment, the job waits for approval.
    # Reviewers can read the plan in the Plan job's summary.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read # to check out the repository
      id-token: write # to request an OIDC token for AWS
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/${{ inputs.role_name }}
          role-session-name: terraform-apply-${{ github.run_id }}
          # Longer than the plan's session, because applies can take a while.
          role-duration-seconds: 3600
          allowed-account-ids: ${{ inputs.aws_account_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -backend-config="$BACKEND_CONFIG" -lockfile=readonly

      - name: Download plan
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ inputs.working_directory }}

      # Applies exactly the planned changes. Terraform refuses to apply the plan
      # if the state has changed since it was created.
      - name: Terraform apply
        run: terraform apply -lock-timeout=5m -no-color tfplan
