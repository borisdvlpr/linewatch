version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot updates the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # AWS provider: the constraint in each stack's terraform.tf and .terraform.lock.hcl.
  # group-by puts one provider bump across every stack into a single PR, so the
  # stacks stay on the same version.
  - package-ecosystem: terraform
    directories:
      - /live/account
      - /live/dev/ingest
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns:
          - "*"
        group-by: dependency-name
